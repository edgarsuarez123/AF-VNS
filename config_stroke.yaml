# RS-Personalized AI-Driven Adaptive Stimulation — Stroke AVNS
# Inherits all AF pipeline values; stroke-specific overrides listed below.
# AF config.yaml is NEVER modified.

paths:
  scaler: models/artifacts/scaler.pkl
  checkpoint: models/checkpoints/best_model.pth
  split: models/artifacts/split.json
  cache_dir: models/artifacts/cache
  phase1_split: models/artifacts/stroke_phase1_split.json
  phase2_split: models/artifacts/stroke_phase2_split.json
  phase1_cache_dir: models/artifacts/cache_stroke_phase1
  phase2_cache_dir: models/artifacts/cache_stroke_phase2
  phase1_scaler: models/artifacts/stroke_phase1_scaler.pkl
  phase2_scaler: models/artifacts/stroke_phase2_scaler.pkl
  phase1_checkpoint: models/checkpoints/stroke_phase1_model.pth
  phase2_checkpoint: models/checkpoints/stroke_phase2_model.pth
  phase_detect_checkpoint: models/checkpoints/phase_detector.pth

data:
  raw_dir: data/raw/stroke avns
  mimic3_stroke_subdir: data/raw/stroke avns/mimic3_stroke
  sharee_subdir: data/raw/stroke avns/shareedb
  cves_subdir: data/raw/stroke avns/cves
  fantasia_subdir: data/raw/stroke avns/fantasia
  # Keep same waveform/HRV windows as AF pipeline so backbone weights transfer cleanly
  waveform_sec: 10
  hrv_window_sec: 300
  target_fs: 250
  stride_sec: 300
  mimic_stride_sec: 150

lsl:
  expected_hz: 250

hrv:
  window_sec: [30, 300]
  subwindow_sec: 60

wavelet:
  family: "cmor"
  scale_range: [1, 64]

artifact:
  amplitude_mad_multiple: 30
  rr_deviation_percent: 60
  rr_fraction_threshold: 0.30

watchdog:
  max_duration_minutes: 5
  max_intensity: 1.0

training:
  learning_rate: 1.0e-3
  batch_size: 32
  max_epochs: 100
  label_smoothing: 0.1

model:
  in_channels: 1
  cnn_embed_dim: 128
  rnn_hidden_size: 64
  rnn_num_layers: 1
  transformer_d_model: 64
  transformer_nhead: 4
  transformer_num_encoder_layers: 1
  transformer_dim_feedforward: 128
  hrv_seq_len: 5
  hrv_n_features: 7
  head_hidden_dim: 64

evaluation:
  threshold: 0.5
  sensitivity_target: 0.80

augmentation:
  enabled: true
  gaussian_snr_range: [20, 40]
  amplitude_scale_range: [0.8, 1.2]
  baseline_freq_range: [0.1, 0.5]
  baseline_amp_range: [0.0, 0.1]
  dropout_prob: 0.2
  dropout_duration_range: [0.05, 0.3]
  powerline_prob: 0.3
  powerline_amp_range: [0.0, 0.05]

# Phase detection settings (Aim 2 — diastolic + exhalation phase)
phase_detection:
  frame_rate_hz: 5.0           # Output frame rate (200ms per frame)
  fallback_fraction: 0.40      # T-end fallback: R + fraction * RR when delineation fails
  min_beats: 2                 # Minimum R-peaks needed; else return all-NaN
  min_hr_bpm: 40.0             # HR below this → reject
  max_hr_bpm: 200.0            # HR above this → reject
  delineate_method: "dwt"      # neurokit2 delineation method
  denoise_before_delineate: true

# ECG-Derived Respiration settings
edr:
  method: "vangent2019"          # nk.ecg_rsp method (0.1-0.4 Hz bandpass)
  min_resp_rate_bpm: 6.0         # Below 6 breaths/min → reject
  max_resp_rate_bpm: 30.0        # Above 30 breaths/min → reject
  min_resp_cycles: 2             # Need at least 2 full respiratory cycles
  denoise_before_edr: true       # CWT denoise before R-peak detection
  mask_edr_exhalation: true      # Force NaN for records without reference resp signal (MIMIC)

# Reference respiratory signal label generation (CVES thermistor / flow_rate)
resp_labels:
  bandpass_low_hz: 0.08          # Just below 6 bpm
  bandpass_high_hz: 0.6          # Just above 30 bpm
  bandpass_order: 4
  min_peak_distance_sec: 1.5     # Max ~40 breaths/min
  min_resp_rate_bpm: 6.0
  max_resp_rate_bpm: 30.0
  min_resp_cycles: 2
  thermst_invert: true           # thermst peaks = end of exhale → invert for inhale-peak convention

# Phase detection precompute (2s windows, 5Hz frame labels)
phase_precompute:
  window_sec: 2.0                    # CNN input window (500 samples @ 250Hz)
  stride_sec: 0.2                    # 1-frame stride for dense overlap
  min_valid_frames: 8                # skip windows with <8/10 non-NaN frames
  frame_rate_hz: 5.0                 # must match phase_detection.frame_rate_hz
  cache_dir: models/artifacts/cache_phase_detect
  ood_cache_dir: models/artifacts/cache_phase_detect_ood
  split_path: models/artifacts/phase_detect_split.json

# Phase detection CNN model (PhaseDetector, ~7.5K params)
phase_model:
  channels: [16, 32, 48]
  kernels: [7, 5, 3]
  strides: [5, 2, 2]
  dropout: 0.1
  n_frames: 10                     # 2s × 5Hz
  n_tasks: 2                       # diastole + exhalation

# Phase detector training hyperparameters
phase_training:
  learning_rate: 1.0e-3
  batch_size: 64
  max_epochs: 100
  patience: 15
  grad_clip: 1.0

# Autonomic state module — 60s sliding-window HRV assessment
autonomic_state:
  window_sec: 60
  features: [lf_hf_ratio, norm_hf_power, sampen, dfa_alpha1]
  fs_resample: 4.0

# Stim parameter recommender — rule-based initially
stim_recommender:
  amplitude_range: [0.0, 10.0]     # mA
  frequency_range: [1.0, 100.0]    # Hz
  pulse_width_range: [50, 500]     # µs
  lf_hf_high: 2.0                  # >2.0 → sympathetic dominant → reduce stim
  norm_hf_low: 0.3                 # <0.3 → poor vagal tone → increase stim
  sampen_high: 2.0                 # >2.0 → high irregularity → reduce stim
  dfa_normal_range: [0.5, 1.5]     # healthy range for DFA-α1

# Stroke-specific settings
stroke:
  conditions: [bifold, cardiac_gated, open_loop]
  n_conditions: 3
  epoch_duration_sec: 300

# 5s window variant — longer context for exhalation detection
phase_precompute_5s:
  window_sec: 5.0
  stride_sec: 0.5
  min_valid_frames: 20        # 25 frames × 80%
  frame_rate_hz: 5.0
  cache_dir: models/artifacts/cache_phase_detect_cves_5s
  split_path: models/artifacts/phase_detect_cves_5s_split.json

phase_model_5s:
  channels: [16, 32, 48]
  kernels: [7, 5, 3]
  strides: [5, 2, 2]
  dropout: 0.1
  n_frames: 25                # 5s × 5Hz
  n_tasks: 2
  input_samples: 1250         # 5s × 250Hz

phase_training_5s:
  learning_rate: 1.0e-3
  batch_size: 64
  max_epochs: 100
  patience: 15
  grad_clip: 1.0
  checkpoint_path: models/checkpoints/phase_detector_5s.pth

# 6a — larger model: channels [32, 64, 96] (~30K params)
phase_model_large:
  channels: [32, 64, 96]
  kernels: [7, 5, 3]
  strides: [5, 2, 2]
  dropout: 0.15
  n_frames: 10
  n_tasks: 2

phase_training_large:
  learning_rate: 1.0e-3
  batch_size: 64
  max_epochs: 100
  patience: 15
  grad_clip: 1.0
  # equal weights — isolates capacity effect
  task_weight_dia: 0.5
  task_weight_exh: 0.5

# 6b — exhalation-weighted loss: 0.3 dia + 0.7 exh
phase_training_weighted:
  learning_rate: 1.0e-3
  batch_size: 64
  max_epochs: 100
  patience: 15
  grad_clip: 1.0
  task_weight_dia: 0.3
  task_weight_exh: 0.7
