# RS-Personalized AI-Driven Adaptive Stimulation (Aim 2) - Phase 1
# Update watchdog and artifact values per Sparrow/FDA limits and validation.

paths:
  scaler: models/artifacts/scaler.pkl
  checkpoint: models/checkpoints/best_model.pth
  split: models/artifacts/split.json
  cache_dir: models/artifacts/cache
  # Two-phase transfer learning paths
  phase1_split: models/artifacts/phase1_split.json
  phase2_split: models/artifacts/phase2_split.json
  phase1_cache_dir: models/artifacts/cache_phase1
  phase2_cache_dir: models/artifacts/cache_phase2
  phase1_scaler: models/artifacts/phase1_scaler.pkl
  phase2_scaler: models/artifacts/phase2_scaler.pkl
  phase1_checkpoint: models/checkpoints/phase1_model.pth
  phase2_checkpoint: models/checkpoints/phase2_model.pth

# Data paths and windows (Step 2; FR-1.2, FR-2.2)
data:
  raw_dir: data/raw/AF avns
  mimic3_subdir: data/raw/AF avns/mimic3
  split_path: models/artifacts/split.json
  splits_dir: data/splits  # optional: materialize_split.py creates train/val/test symlinks here
  waveform_sec: 10
  hrv_window_sec: 300  # 5 min for RNN; also use hrv.window_sec [30, 300] for short HRV
  target_fs: 250  # resample all records to uniform rate (afdb=250Hz, nsrdb=128Hz)
  max_ltaf_segments: 84  # DECISION: cap at 1 segment per patient (84 patients) for diversity; 2654 segs -> ~47k windows (was 401k)
  # mimic3_holdout removed — all MIMIC-3 goes into Phase 1 training; C2017 is sole OOD eval
  include_challenge2017: false  # removed from training; 30-61s records can't fill 300s HRV window
  stride_sec: 300  # non-overlapping 5-min windows for baseline; reduce later for augmentation
  mimic_stride_sec: 150  # halved stride for MIMIC → 2-4x more windows per record

# LSL live stream (FR-1.1)
lsl:
  expected_hz: 250

# HRV windows in seconds (FR-2.2): 30 s and 5 min; subwindow for RNN sequence (Step 3)
hrv:
  window_sec: [30, 300]
  subwindow_sec: 60  # one HRV vector per 60 s -> 5 time steps over 5 min

# CWT for wavelet_filter.py
wavelet:
  family: "cmor"
  scale_range: [1, 64]  # adjust per signal; baseline <0.5 Hz removal

# artifact_scrubber.py - placeholder; update per validation
artifact:
  amplitude_mad_multiple: 30  # raised from 5: normal ECG QRS spikes are 5-25x MAD; only catch true lead-off/saturation
  rr_deviation_percent: 60  # raised from 25: AF has irregular RR (40-60% deviation is normal in AF)
  rr_fraction_threshold: 0.30  # reject only if >30% of beats are outliers (was np.any = 0%)

# watchdog.py - Sparrow/FDA placeholders; update with real limits (FR-4.2)
watchdog:
  max_duration_minutes: 5
  max_intensity: 1.0

# train.py
training:
  learning_rate: 1.0e-3
  batch_size: 32
  max_epochs: 100  # N for AUROC contingency
  label_smoothing: 0.1  # soften 0→0.05, 1→0.95 to reduce OOD overconfidence

# Step 4: Hybrid model architecture (Phase 1)
model:
  in_channels: 1
  cnn_embed_dim: 128
  rnn_hidden_size: 64
  rnn_num_layers: 1
  transformer_d_model: 64
  transformer_nhead: 4
  transformer_num_encoder_layers: 1
  transformer_dim_feedforward: 128
  hrv_seq_len: 5
  hrv_n_features: 7
  head_hidden_dim: 64  # intermediate head dimension for two-phase transfer learning

# Evaluation settings
evaluation:
  threshold: 0.5          # classification threshold (update after threshold analysis)
  sensitivity_target: 0.80  # min sensitivity for optimal threshold search

# On-the-fly waveform augmentation (training only)
augmentation:
  enabled: true
  gaussian_snr_range: [20, 40]
  amplitude_scale_range: [0.8, 1.2]
  baseline_freq_range: [0.1, 0.5]
  baseline_amp_range: [0.0, 0.1]
  dropout_prob: 0.2
  dropout_duration_range: [0.05, 0.3]
  powerline_prob: 0.3
  powerline_amp_range: [0.0, 0.05]
